[package]
name = "ai_service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2"

utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

thiserror = "2"
dotenvy = "0.15"
async-trait = "0.1"
